<!DOCTYPE html>

<html lang="en">

<head><script type="text/javascript"></script>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>pokeapi project copy</title>
     <link rel="stylesheet" href="style.css">
     <script src="script.js" type="text/javascript"></script>
     <script src="https://kit.fontawesome.com/a95b8b142d.js" crossorigin="anonymous"></script>

</head>

<body>
    <header>
        <button class = "tgl" onclick = "toggleHeading()"><img src = "https://cdn-icons-png.freepik.com/256/189/189012.png" class = "dex-logo"></button>
        <!--<h1 class = "dex-title">Pokédex</h1>-->
        <div class = "heading">
            <div class = "filter">
                <button class = "filter-btn" onclick = "sortAlpha()">Alphabetical</button>
                <button class = "filter-btn" onclick = "sortRevAlpha()">Reverse Alphabetical</button>
            </div>
        </div>
    </header>
    <section id="landing">
        <div class="container">
            <div class="row">
                <div class="matrix-container">
                    <div class = "matrix__default">
                        <input type="text" placeholder="«POKÉMON»" />
                        <div class="rain"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class = "dex-entry">
        <section id = "dex-left">
            <div class = "dex-left">
                
            </div>
        </section>

        <section id = "dex-right">
            <!--name, type, habitat? gen?-->
            <div class = "dex-right">
                
            </div>
        </section>
    </div>

    <section id = "dex-results">
        <div class = "dex-results">
            <div class = "container">
                <div class = "row">
                    <div class = "results">
                        
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>using PokeAPI!</p>
        <p>made by Alex Jagadish :]</p>
    </footer>
</body>

</html>
