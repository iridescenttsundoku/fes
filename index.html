<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dota 2 api</title>
    <link rel = "stylesheet" href = "style.css">
    <script src = "script.js" type = "text/javascript"></script>
    <script src = "https://kit.fontawesome.com/a95b8b142d.js" crossorigin = "anonymous"></script>
</head>
<body>
    <header>
        <div><img class = "logo" src = "https://logos-world.net/wp-content/uploads/2020/12/Dota-2-Logo.png"></div>
        <div class = "search">
            <button class = "search__btn click" onclick = "toggleSearch()"><i class="fa-solid fa-magnifying-glass fa-2x"></i></button>
            <button class = "filter__btn click" onclick = "toggleFilter()"><i class="fa-solid fa-filter"></i></button>
            <div class = "search__bar">
                <input class = "search__bar--input" type = "text" placeholder = "search...">
            </div>
            <div class = "filter__dropdown">
                <select onchange = "handleChange()">
                    <option>agility</option>
                    <option>intelligence</option>
                    <option>strength</option>
                    <option>all</option>
                </select>
            </div>
        </div>
    </header>
    <section id = "search-results">
        <div class = "container">
            <div class = "row search__row">
            </div>
        </div>
    </section>

    <section id = "cards">
        <div class="perspective">
            <div class="perspective__flex">
                <div class="perspective__col">
                    <div class="perspective-item perspective-item__left">
                        <div class = "perspective-item__info">
                            <div class = "info-imgs">
                                <img class = "basic-img" src = "https://static.wikia.nocookie.net/dota2_gamepedia/images/2/2d/Agility_attribute_symbol.png" alt = "agility"> 
                                <img class = "basic-img" src = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/icons/melee.svg" alt = "melee">
                                <!--dota 2 attack icons: https://dotacoach.gg/en/agility-->
                            </div>
                            <div class = "info-basic">
                                <p>Carry.</p>
                                <br>
                                <p>Durable.</p>
                                <br>
                                <p>Escape.</p>
                            </div>
                        </div>
                        <div class="perspective-item__icon"><img src="https://cdn.steamstatic.com/apps/dota2/videos/dota_react/heroes/renders/spectre.png" alt=""/></div>
                    </div>
                </div>
                <div class="perspective__col">
                    <div class="perspective-item perspective-item__right">
                        <p>← spectre. favourite of a friend's. search up any hero from dota 2 and get their basic info! :)</p><br>
                        <p>i don't know anything about dota 2 so please don't ask. i only know it through aforementioned friend.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <footer>
        <div class>
            <p>Made using <a href = "https://www.opendota.com">OpenDota</a>!</p>
        </div>
    </footer>
</body>
