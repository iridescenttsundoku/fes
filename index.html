<!DOCTYPE html>

<html lang="en">

<head><script type='text/javascript'></script>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>pokeapi project copy</title>
     <link rel="stylesheet" href="style.css">
     <script src="script.js" type="text/javascript"></script>
     <script src="https://kit.fontawesome.com/a95b8b142d.js" crossorigin="anonymous"></script>

<body>
     <header>
        <button onclick = "toggleHeading()"><img src = "https://cdn-icons-png.freepik.com/256/189/189012.png" class = "dex-logo"></button>

            <h1 class = "head-top">Look up any Pokémon and get their type(s), habitat and base stats</h1>
        </div>
      </header>
     <section id="landing" onmousemove="moveBackground(event)">
         <div class="container">
             <div class="row">
                 <div class="matrix-container">
                    <input type="text" placeholder="«POKÉMON»" />
                     <div class="rain"></div>
                 </div>
             </div>
         </div>
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/710.png" class="shape shape--0">
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/035.png" class="shape shape--1">
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/1017.png" class="shape shape--2">
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/035.png" class="shape shape--3">
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/152.png" class="shape shape--4">
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/035.png" class="shape shape--5">
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/710.png" class="shape shape--6">
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/1017.png" class="shape shape--7">
         <img src="https://www.pokemon.com/static-assets/content-assets/cms2/img/pokedex/full/152.png" class="shape shape--8">
     </section>

</html>
